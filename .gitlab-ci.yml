stages:
  - build

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64 # Указываем GitLab использовать сервер на Windows
  script:
    - cmake -B build -G "Visual Studio 17 2022" -A x64
    - cmake --build build --config Release
  artifacts:
    name: "Antivirus-Executable-WinUI3"
    paths:
      - build/Release/Antivirus.exe
    expire_in: 1 week